# ~/AuronOrigin/n8n/docker-compose.yml  — laeuft auf dem 24/7-Laptop (5 GB RAM)
# Speicherbewusst: 1 Worker, SQLite, Execution-Pruning, 1,1 GB RAM-Limit.
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      NODE_OPTIONS: --max-old-space-size=640
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      DB_SQLITE_POOL_SIZE: "1"
      EXECUTIONS_DATA_PRUNE_ON: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "300"
    volumes:
      - ./n8n_data:/home/node/.n8n
    mem_limit: 1100m
    mem_reservation: 512m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
